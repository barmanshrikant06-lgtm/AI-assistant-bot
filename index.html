
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.app {
    width: 100%;
    max-width: 650px;
    height: 90vh;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px #0004;
}

header {
    background: #4338ca;
    color: white;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

header h2 {
    font-size: 22px;
}

header p {
    font-size: 12px;
    margin-top: 5px;
    color: #ddd;
}

.clear {
    background: #ffffff22;
    color: white;
    border: 1px solid #ffffff55;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.settings {
    padding: 12px 15px;
    background: #f3f4f6;
    display: flex;
    gap: 8px;
}

.settings input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
}

.settings button {
    border: none;
    background: #4338ca;
    color: white;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    background: #f9fafb;
}

.message {
    padding: 12px 15px;
    border-radius: 14px;
    margin-bottom: 15px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #4338ca;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 3px;
}

.bot {
    background: white;
    color: #222;
    border: 1px solid #e5e7eb;
    margin-right: auto;
    border-bottom-left-radius: 3px;
}

.welcome {
    text-align: center;
    margin-top: 65px;
    color: #555;
}

.welcome h2 {
    color: #4338ca;
    margin-bottom: 10px;
}

.input-area {
    padding: 15px;
    display: flex;
    gap: 10px;
    border-top: 1px solid #eee;
}

#userInput {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

#sendBtn {
    background: #4338ca;
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
}

#sendBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    text-align: center;
    font-size: 12px;
    padding: 5px;
    color: #666;
    background: #fff;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div>
        <h2>🤖 My AI Assistant</h2>
        <p>Powered by Groq AI</p>
    </div>
    <button class="clear" onclick="clearChat()">Clear Chat</button>
</header>

<div class="settings">
    <input type="password" id="apiKey"
    placeholder="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
    <button onclick="toggleKey()">Show</button>
</div>

<div id="chat">
    <div class="welcome" id="welcome">
        <h2>👋 Hello! I'm your AI Assistant</h2>
        <p>Ask me anything. I am ready to help you!</p>
    </div>
</div>

<div class="status" id="status">🟢 Ready to chat</div>

<div class="input-area">
    <input id="userInput"
    type="text"
    placeholder="Message your AI Assistant..."
    autocomplete="off">

    <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
</div>

</div>

<script>
const MODEL = "llama-3.3-70b-versatile";

const API_URL =
"https://api.groq.com/openai/v1/chat/completions";

let messages = [
    {
        role: "system",
        content: "You are a friendly and intelligent AI assistant. Answer questions helpfully. Reply in the language used by the user."
    }
];

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

function toggleKey() {
    const key = document.getElementById("apiKey");
    key.type = key.type === "password" ? "text" : "password";
}

function addMessage(text, type) {
    document.getElementById("welcome")?.remove();

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {
    const text = input.value.trim();
    const apiKey = document.getElementById("apiKey").value.trim();

    if (!text) return;

    if (!apiKey) {
        alert("Please enter your Groq API Key!");
        return;
    }

    addMessage(text, "user");
    input.value = "";

    messages.push({
        role: "user",
        content: text
    });

    sendBtn.disabled = true;
    statusText.textContent = "⌛ AI is thinking...";

    const loading = addMessage("Thinking...", "bot");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
                model: MODEL,
                messages: messages,
                temperature: 0.7,
                max_completion_tokens: 2048
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const answer =
            data.choices?.[0]?.message?.content;

        if (!answer) {
            throw new Error("No response received from AI.");
        }

        loading.textContent = answer;

        messages.push({
            role: "assistant",
            content: answer
        });

        statusText.textContent = "🟢 Ready to chat";

    } catch (error) {
        loading.textContent = "❌ Error: " + error.message;

        messages.pop();

        statusText.textContent = "🔴 Something went wrong";

    } finally {
        sendBtn.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
    }
}

function clearChat() {
    messages = [
        {
            role: "system",
            content: "You are a friendly and intelligent AI assistant. Answer questions helpfully. Reply in the language used by the user."
        }
    ];

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h2>👋 Hello! I'm your AI Assistant</h2>
            <p>Ask me anything. I am ready to help you!</p>
        </div>
    `;

    statusText.textContent = "🟢 Chat cleared";
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
