
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI AI Assistant</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
 background:linear-gradient(135deg,#0f172a,#4338ca,#7c3aed);
 height:100vh;display:flex;align-items:center;justify-content:center;padding:12px
}
.app{
 width:100%;max-width:700px;height:95vh;background:#fff;
 border-radius:20px;display:flex;flex-direction:column;overflow:hidden;
 box-shadow:0 15px 50px #0005
}
header{
 background:#171717;color:white;padding:18px;
 display:flex;justify-content:space-between;align-items:center
}
header h2{font-size:21px}
header small{color:#aaa}
#clear{
 background:#333;color:white;border:0;padding:10px;border-radius:8px;cursor:pointer
}
.keybox{padding:12px;background:#f2f2f2;display:flex;gap:7px}
.keybox input{
 flex:1;min-width:0;padding:11px;border:1px solid #ccc;border-radius:8px
}
.keybox button{
 border:0;background:#444;color:white;padding:10px;border-radius:8px;cursor:pointer
}
#chat{
 flex:1;overflow-y:auto;padding:16px;background:#f8fafc
}
.msg{
 padding:12px 14px;margin-bottom:12px;border-radius:14px;
 max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55
}
.user{background:#4f46e5;color:white;margin-left:auto}
.bot{background:white;border:1px solid #ddd;color:#222;margin-right:auto}
.welcome{text-align:center;margin-top:65px;color:#555}
.welcome h2{color:#4f46e5;margin-bottom:10px}
#status{text-align:center;padding:6px;font-size:12px;color:#666}
.bottom{display:flex;padding:12px;gap:8px;border-top:1px solid #ddd}
.bottom input{
 flex:1;min-width:0;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:15px
}
.bottom button{
 background:#4f46e5;color:white;border:0;border-radius:12px;padding:0 18px;cursor:pointer
}
button:disabled{opacity:.5}
</style>
</head>

<body>
<div class="app">

<header>
 <div>
  <h2>🤖 AI Assistant</h2>
  <small>Powered by Groq • GPT-OSS</small>
 </div>
 <button id="clear" onclick="clearChat()">Clear</button>
</header>

<div class="keybox">
 <input id="apiKey" type="password" placeholder="Enter Groq API Key (gsk_...)">
 <button onclick="showKey()">Show</button>
</div>

<div id="chat">
 <div class="welcome" id="welcome">
  <h2>Welcome to AI Assistant 👋</h2>
  <p>Ask me anything!</p>
 </div>
</div>

<div id="status">Ready</div>

<div class="bottom">
 <input id="input" placeholder="Write your message..." autocomplete="off">
 <button id="send" onclick="sendMessage()">Send ➤</button>
</div>

</div>

<script>
const MODEL = "openai/gpt-oss-20b";
const API = "https://api.groq.com/openai/v1/chat/completions";

let history = [{
 role:"system",
 content:"You are a helpful, intelligent AI assistant. Answer clearly and accurately. Speak Hindi, English or Hinglish according to the user's language."
}];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("send");

function showKey(){
 const k=document.getElementById("apiKey");
 k.type=k.type==="password"?"text":"password";
}

function addMsg(text,role){
 document.getElementById("welcome")?.remove();
 const d=document.createElement("div");
 d.className="msg "+role;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
 return d;
}

async function sendMessage(){
 const text=input.value.trim();
 const key=document.getElementById("apiKey").value.trim();

 if(!text)return;
 if(!key){
  alert("Please enter your Groq API key first!");
  return;
 }

 addMsg(text,"user");
 input.value="";
 history.push({role:"user",content:text});

 sendBtn.disabled=true;
 statusEl.textContent="AI is thinking...";

 const loading=addMsg("Thinking...","bot");

 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer "+key
   },
   body:JSON.stringify({
    model:MODEL,
    messages:history,
    temperature:0.7,
    max_completion_tokens:2048
   })
  });

  const result=await response.json();

  if(!response.ok){
   throw new Error(result.error?.message || "API error");
  }

  const answer=result.choices?.[0]?.message?.content;

  if(!answer)throw new Error("Empty response");

  loading.textContent=answer;
  history.push({role:"assistant",content:answer});
  statusEl.textContent="Ready 🟢";

 }catch(err){
  loading.textContent="Error: "+err.message;
  history.pop();
  statusEl.textContent="Error 🔴";
 }finally{
  sendBtn.disabled=false;
  input.focus();
  chat.scrollTop=chat.scrollHeight;
 }
}

function clearChat(){
 history=[{
  role:"system",
  content:"You are a helpful, intelligent AI assistant. Answer clearly and accurately. Speak Hindi, English or Hinglish according to the user's language."
 }];

 chat.innerHTML=`
 <div class="welcome" id="welcome">
 <h2>Welcome to AI Assistant 👋</h2>
 <p>Ask me anything!</p>
 </div>`;

 statusEl.textContent="Chat cleared";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
